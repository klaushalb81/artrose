[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Turbopack's build cache records env values for cache invalidation. It is not
  # deployed, but Netlify's secret scanner flags it, so skip just that folder.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

# Netlify's Next.js runtime turns App Router pages and route handlers
# (/api/checkout, /api/stripe/webhook, /watch/[token], ...) into serverless
# functions. No long-running server is assumed.
[[plugins]]
  package = "@netlify/plugin-nextjs"
